# Ruchy Syntax Tools - PDMT Roadmap Configuration
# Project Development Management Template (PDMT) v2.0
# Integrated with PMAT quality gates and Toyota Way methodology

project:
  name: "ruchy-syntax-tools"
  version: "0.1.0"
  start_date: "2025-08-23"
  target_completion: "2025-09-23"
  methodology: "Sprint-based Agile Development with Quality Gates"
  task_id_pattern: "RSYN-[0-9]{4}"
  
task_categories:
  FOUND: "Foundation & Infrastructure"
  TMGR: "TextMate Grammar"
  TSGR: "Tree-sitter Grammar" 
  WEBGR: "Web Grammars (highlight.js, Prism)"
  QUAL: "Quality & Testing"
  UPSTR: "Upstream Integration"

phases:
  P0_Foundation:
    name: "Foundation Infrastructure"
    priority: "P0"
    duration_weeks: 1
    description: "Core build system and project structure"
    success_criteria:
      - "Build system functional with all targets"
      - "Basic TextMate grammar compiles successfully"
      - "Test framework validates grammar correctness"
    
  P1_Grammar:
    name: "TextMate Grammar Completion"
    priority: "P1"
    duration_weeks: 1
    description: "Complete TextMate grammar implementation"
    dependencies: ["P0_Foundation"]
    success_criteria:
      - "All Ruchy language constructs highlighted"
      - "Performance targets met (<25ms)"
      - "Visual regression tests passing"
    
  P2_MultiPlatform:
    name: "Multi-Platform Extension"
    priority: "P1"
    duration_weeks: 1
    description: "Tree-sitter, highlight.js, Prism support"
    dependencies: ["P1_Grammar"]
    success_criteria:
      - "3+ grammar formats implemented"
      - "Cross-platform validation complete"
      - "VS Code extension functional"
    
  P3_Upstream:
    name: "Upstream Integration"
    priority: "P2"
    duration_weeks: 1
    description: "Submit to upstream repositories"
    dependencies: ["P2_MultiPlatform"]
    success_criteria:
      - "GitHub Linguist PR submitted"
      - "VS Code Marketplace published"
      - "Community documentation complete"

